stages:
  - docker
  - lint
  - test

workflow:
  auto_cancel:
    on_new_commit: conservative

# Include the steps for docker and playwright
include:
  # Build the Docker image
  - component: $CI_SERVER_FQDN/2pisoftware/pipelines/docker/build@v1.3.0
    inputs:
      stage: docker
      platforms: linux/amd64,linux/arm64

  - component: $CI_SERVER_FQDN/2pisoftware/pipelines/php/lint@2.2.1
    inputs:
      ignore: "*.js,*.css,system/lib/*"

  - component: $CI_SERVER_FQDN/2pisoftware/pipelines/php/test@2.2.1
    inputs:
      stage: test

php-lint:
  interruptible: true
  allow_failure: true
   
docker-build:
  interruptible: true
  tags:
    - largemem_x86

cosine-test:
  interruptible: true

php-unit:
  stage: test
  interruptible: true
  # Run against the image this pipeline built, so the tests use the same PHP
  # build the application uses. The docker component does not export the tag
  # it computes, so this rebuilds the same reference.
  image: $COSINE_IMAGE
  variables:
    COSINE_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
    PHPUNIT: "10"
  needs:
    - docker-build
  before_script:
    # phpunit needs two extensions the runtime image does not ship
    - apk add --no-cache php$PHP_VERSION-ctype php$PHP_VERSION-tokenizer
    - curl -sSL https://phar.phpunit.de/phpunit-${PHPUNIT}.phar -o /usr/local/bin/phpunit
    - chmod +x /usr/local/bin/phpunit
  script:
    - phpunit --configuration test/php/phpunit.xml --log-junit phpunit-junit.xml --do-not-cache-result
  artifacts:
    when: always
    reports:
      junit: phpunit-junit.xml
    expire_in: 1 day
